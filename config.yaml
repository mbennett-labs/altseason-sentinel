# Altseason Sentinel Configuration
# ================================

# Update frequency (in seconds)
update_interval_seconds: 300  # 5 minutes (adjust as needed)

# Discord notifications
discord:
  enabled: true
  webhook_url: "YOUR_DISCORD_WEBHOOK_URL"  # Get from Discord Server Settings > Integrations > Webhooks

# Email notifications (for critical alerts only)
email:
  enabled: false  # Set to true when configured
  smtp_server: "smtp.gmail.com"
  smtp_port: 587
  from_email: "your.email@gmail.com"
  to_email: "your.email@gmail.com"
  password: "your_app_password"  # Use Gmail App Password, not regular password

# Data logging
logging:
  enabled: true
  file: "altseason_data.csv"

# Alert preferences
alerts:
  # Minimum time between duplicate alerts (minutes)
  duplicate_threshold_minutes: 30
  
  # Which alert levels to send to Discord
  discord_levels:
    - CRITICAL
    - BULLISH
    - WARNING
    - OPPORTUNITY
  
  # Which alert levels to send via email
  email_levels:
    - CRITICAL

# API rate limiting (adjust if you hit limits)
api:
  coingecko_delay_seconds: 1  # Delay between CoinGecko calls
  max_retries: 3
